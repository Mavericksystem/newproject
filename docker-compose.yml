services:
  db:
    image: pgvector/pgvector:pg17
    container_name: temporal-kb-db
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki
      POSTGRES_DB: temporal
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # *.sql files here run once, on first start of an empty volume
      - ./db:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wiki -d temporal" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
